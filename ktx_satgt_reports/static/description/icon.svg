<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo: pastel fuerte indigo/azul fiscal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8BFF"/>
      <stop offset="1" stop-color="#4F5BD5"/>
    </linearGradient>
    <!-- Documento / libro contable -->
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1FF"/>
    </linearGradient>
    <!-- Barras esmeralda (reporte) -->
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <!-- Sello fiscal ámbar -->
    <linearGradient id="stampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A2F66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#FFFFFF" opacity="0.06"/>

  <!-- Stack de libros (representa libros de compras/ventas) -->
  <g filter="url(#softShadow)">
    <!-- libro trasero 2 -->
    <rect x="56" y="50" width="120" height="150" rx="12" fill="#C7CEFF" transform="rotate(-8 116 125)"/>
    <!-- libro trasero 1 -->
    <rect x="60" y="54" width="120" height="150" rx="12" fill="#DDE2FF" transform="rotate(-4 120 129)"/>
    <!-- documento frontal -->
    <g>
      <rect x="64" y="56" width="124" height="152" rx="12" fill="url(#docGrad)"/>
      <!-- lomo izquierdo -->
      <rect x="64" y="56" width="16" height="152" rx="12" fill="#4F5BD5" opacity="0.18"/>
      <!-- encabezado: chip SAT -->
      <rect x="92" y="72" width="54" height="22" rx="6" fill="#4F5BD5"/>
      <text x="119" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SAT</text>
      <!-- % a la derecha -->
      <text x="166" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#10B981" text-anchor="middle">%</text>

      <!-- Gráfica de barras (reporte fiscal) -->
      <rect x="94"  y="150" width="16" height="36" rx="3" fill="url(#barGrad)"/>
      <rect x="116" y="134" width="16" height="52" rx="3" fill="url(#barGrad)"/>
      <rect x="138" y="120" width="16" height="66" rx="3" fill="url(#barGrad)"/>
      <rect x="160" y="142" width="16" height="44" rx="3" fill="url(#barGrad)"/>
      <!-- linea base -->
      <rect x="90" y="188" width="92" height="4" rx="2" fill="#CBD2F0"/>

      <!-- lineas de texto (conceptos) -->
      <rect x="92" y="108" width="58" height="6" rx="3" fill="#CBD2F0"/>
      <rect x="92" y="120" width="40" height="6" rx="3" fill="#CBD2F0"/>
    </g>
  </g>

  <!-- Sello fiscal (esquina inferior derecha) -->
  <g filter="url(#softShadow)" transform="translate(182,178)">
    <circle r="34" fill="url(#stampGrad)"/>
    <circle r="34" fill="#FFFFFF" opacity="0.10"/>
    <circle r="26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.85"/>
    <!-- check de declaración aprobada -->
    <polyline points="-13,2 -4,12 14,-12" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3efff"/>
      <stop offset="100%" style="stop-color:#eafaf2"/>
    </linearGradient>
    <linearGradient id="pur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#7c3aed22"/>
    </filter>
    <style>
      .title{animation:inD .7s ease both}
      .tag{animation:inD .7s ease both .25s}
      .cloud{animation:pop .6s cubic-bezier(.2,1.3,.5,1) both .3s; opacity:0; transform-box:fill-box; transform-origin:center}
      .panel{animation:inU .6s ease both .3s}
      .r1{animation:inU .5s ease both 1.1s; opacity:0}
      .r2{animation:inU .5s ease both 1.9s; opacity:0}
      .r3{animation:inU .5s ease both 2.7s; opacity:0}
      .r4{animation:inU .5s ease both 3.5s; opacity:0}
      .badge{animation:fin .5s ease both 4.0s; opacity:0}
      .pipe{stroke-dasharray:6 6; animation:flow 1s linear infinite}
      .float{animation:fl 5s ease-in-out infinite}
      @keyframes inD{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
      @keyframes inU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes fin{from{opacity:0}to{opacity:1}}
      @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
      @keyframes flow{to{stroke-dashoffset:-24}}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="900" height="300" fill="url(#bg)" rx="16"/>
  <circle class="float" cx="60" cy="250" r="40" fill="#7c3aed" opacity="0.06"/>
  <circle cx="470" cy="36" r="22" fill="#059669" opacity="0.07"/>

  <!-- Title -->
  <text class="title" x="40" y="34" font-size="21" font-weight="800" fill="#1e293b">FEL2Odoo — Automatiza tu FEL de la SAT</text>
  <text class="tag" x="41" y="55" font-size="12" fill="#64748b" font-weight="500">Sincroniza los DTE de la SAT Guatemala y crea tus facturas en Odoo, automatico</text>

  <!-- pipe path (docs travel along it) -->
  <path id="pipe" d="M150,168 C230,168 240,158 300,158 C360,158 400,158 470,158" fill="none"/>
  <path class="pipe" d="M150,168 C230,168 240,158 300,158 C360,158 400,158 470,158" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>

  <!-- ── SAT cloud (source) ── -->
  <g class="cloud">
    <g filter="url(#sh)">
      <ellipse cx="98" cy="150" rx="62" ry="40" fill="#ffffff"/>
      <circle cx="66" cy="150" r="26" fill="#ffffff"/>
      <circle cx="130" cy="150" r="26" fill="#ffffff"/>
      <circle cx="98" cy="128" r="30" fill="#ffffff"/>
    </g>
    <text x="98" y="146" text-anchor="middle" font-size="17" font-weight="900" fill="#7c3aed">SAT</text>
    <text x="98" y="163" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669" letter-spacing="1">FEL · DTE</text>
  </g>

  <!-- ── apifelcore sync gear (outer=posición; inner=rota) ── -->
  <g transform="translate(300,158)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle r="17" fill="url(#pur)"/>
      <g fill="#7c3aed">
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(0)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(45)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(90)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(135)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(180)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(225)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(270)"/>
        <rect x="-2.6" y="-24" width="5.2" height="8" rx="1.5" transform="rotate(315)"/>
      </g>
      <circle r="7" fill="#ffffff"/>
    </g>
    <text x="0" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">apifelcore</text>
  </g>

  <!-- ── XML docs traveling from SAT to Odoo ── -->
  <g>
    <g><rect x="-18" y="-12" width="36" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#7c3aed">XML</text>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#pipe"/></animateMotion></g>
    <g><rect x="-18" y="-12" width="36" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#7c3aed">XML</text>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath href="#pipe"/></animateMotion></g>
    <g><rect x="-18" y="-12" width="36" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#7c3aed">XML</text>
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#pipe"/></animateMotion></g>
  </g>

  <!-- ═══════════ ODOO INVOICES PANEL ═══════════ -->
  <g class="panel">
    <rect x="486" y="84" width="386" height="192" rx="12" fill="#ffffff" filter="url(#sh)"/>
    <rect x="486" y="84" width="386" height="30" rx="12" fill="#faf5ff"/>
    <rect x="486" y="102" width="386" height="12" fill="#faf5ff"/>
    <circle cx="506" cy="99" r="7" fill="#714B67"/>
    <text x="520" y="103" font-size="11" font-weight="800" fill="#714B67">Facturas en Odoo</text>
    <text x="856" y="103" text-anchor="end" font-size="9.5" font-weight="700" fill="#94a3b8">FEL</text>
  </g>

  <!-- rows appear as docs arrive -->
  <g class="r1"><rect x="498" y="122" width="362" height="32" rx="7" fill="#f5f3ff"/>
    <text x="512" y="142" font-size="11.5" font-weight="700" fill="#1f2937">FEL1/2026/00001</text>
    <text x="690" y="142" font-size="11.5" font-weight="700" fill="#4338ca">Q 168.00</text>
    <g transform="translate(838,138)"><circle r="9" fill="#10b981"/><path d="M-4,0 L-1,3 L4,-4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <g class="r2"><rect x="498" y="158" width="362" height="32" rx="7" fill="#ffffff"/>
    <text x="512" y="178" font-size="11.5" font-weight="700" fill="#1f2937">FEL1/2026/00002</text>
    <text x="690" y="178" font-size="11.5" font-weight="700" fill="#4338ca">Q 1,280.00</text>
    <g transform="translate(838,174)"><circle r="9" fill="#10b981"/><path d="M-4,0 L-1,3 L4,-4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <g class="r3"><rect x="498" y="194" width="362" height="32" rx="7" fill="#f5f3ff"/>
    <text x="512" y="214" font-size="11.5" font-weight="700" fill="#1f2937">FEL1/2026/00003</text>
    <text x="690" y="214" font-size="11.5" font-weight="700" fill="#4338ca">Q 540.00</text>
    <g transform="translate(838,210)"><circle r="9" fill="#10b981"/><path d="M-4,0 L-1,3 L4,-4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <g class="r4"><rect x="498" y="230" width="362" height="32" rx="7" fill="#ffffff"/>
    <text x="512" y="250" font-size="11.5" font-weight="700" fill="#1f2937">FEL1/2026/00004</text>
    <text x="690" y="250" font-size="11.5" font-weight="700" fill="#4338ca">Q 3,750.00</text>
    <g transform="translate(838,246)"><circle r="9" fill="#10b981"/><path d="M-4,0 L-1,3 L4,-4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- badge -->
  <g class="badge" transform="translate(690,99)">
    <rect x="-2" y="-13" width="150" height="24" rx="12" fill="#dcfce7"/>
    <text x="73" y="3" text-anchor="middle" font-size="10.5" font-weight="800" fill="#166534">&#10003; creadas automaticamente</text>
  </g>

  <!-- footer -->
  <text x="450" y="292" text-anchor="middle" font-size="9.5" fill="#94a3b8" font-weight="500">
    Consulta · descarga · importa · emite · anula — compras y ventas FEL de la SAT, sin capturar a mano
  </text>
</svg>
